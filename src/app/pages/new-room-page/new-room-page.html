<div class="new-room-backdrop">
  <div class="new-room-modal">

    <div class="new-room-header">
      <button mat-icon-button type="button" (click)="goBack()">
        <mat-icon>arrow_back</mat-icon>
      </button>
      <h2 class="new-room-title">New Room</h2>
    </div>

    <div class="new-room-fields">
      <div class="field-group">
        <label>Campus</label>
        <input type="text" placeholder="e.g. Main Campus" [value]="campus()" (input)="campus.set($any($event.target).value)" />
      </div>
      <div class="field-group">
        <label>Building</label>
        <input type="text" placeholder="e.g. Harvard Hall" [value]="building()" (input)="building.set($any($event.target).value)" />
      </div>
      <div class="field-group">
        <label>Room</label>
        <input type="text" placeholder="e.g. 101" [value]="room()" (input)="room.set($any($event.target).value)" />
      </div>
      <div class="field-group">
        <label>IP Address</label>
        <input type="text" placeholder="e.g. 192.168.1.100" [value]="ip()" (input)="ip.set($any($event.target).value)" />
      </div>
      <div class="field-group">
        <label>Template <span class="optional">(optional)</span></label>
        <select [value]="selectedTemplateId()" (change)="selectedTemplateId.set($any($event.target).value)">
          <option value="">No template — blank room</option>
          @for (t of templates(); track t._id) {
            <option [value]="t._id">{{ t.name }}</option>
          }
        </select>
      </div>
    </div>

    @if (error()) {
      <p class="new-room-error">{{ error() }}</p>
    }

    <div class="new-room-actions">
      <button mat-stroked-button type="button" (click)="customize()" [disabled]="!formValid || saving()">
        Customize
      </button>
      <button mat-flat-button color="primary" type="button" (click)="create()" [disabled]="!formValid || saving()">
        @if (saving()) { Creating… } @else { Create Room }
      </button>
    </div>

  </div>
</div>
