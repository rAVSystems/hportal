<div class="cp-shell">
  <div class="cp-card">
    <div class="cp-icon">
      <mat-icon>lock_reset</mat-icon>
    </div>
    <h2>Change Password</h2>
    <p class="cp-sub">You're using the default password. Please set a new password before continuing.</p>

    <div class="field-stack">
      <input type="text" [value]="auth.user()?.username ?? ''" autocomplete="username" style="display:none" readonly />
      <mat-form-field appearance="outline">
        <mat-label>Current Password</mat-label>
        <input matInput [type]="showCurrent() ? 'text' : 'password'" [value]="currentPassword()" (input)="currentPassword.set($any($event.target).value)" autocomplete="current-password" />
        <button mat-icon-button matSuffix type="button" (click)="showCurrent.set(!showCurrent())">
          <mat-icon>{{ showCurrent() ? 'visibility_off' : 'visibility' }}</mat-icon>
        </button>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>New Password</mat-label>
        <input matInput [type]="showNew() ? 'text' : 'password'" [value]="newPassword()" (input)="newPassword.set($any($event.target).value)" autocomplete="new-password" />
        <button mat-icon-button matSuffix type="button" (click)="showNew.set(!showNew())">
          <mat-icon>{{ showNew() ? 'visibility_off' : 'visibility' }}</mat-icon>
        </button>
        <mat-hint>Minimum 8 characters</mat-hint>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Confirm New Password</mat-label>
        <input matInput [type]="showConfirm() ? 'text' : 'password'" [value]="confirmPassword()" (input)="confirmPassword.set($any($event.target).value)" autocomplete="new-password" />
        <button mat-icon-button matSuffix type="button" (click)="showConfirm.set(!showConfirm())">
          <mat-icon>{{ showConfirm() ? 'visibility_off' : 'visibility' }}</mat-icon>
        </button>
        @if (passwordMismatch) {
          <mat-error>Passwords do not match</mat-error>
        }
      </mat-form-field>
    </div>

    @if (error()) {
      <p class="error-msg">{{ error() }}</p>
    }

    <button mat-flat-button color="primary" class="cta-btn" (click)="submit()" [disabled]="!formValid || loading()">
      @if (loading()) { Saving… } @else { Set New Password }
    </button>
  </div>
</div>
