<div class="control-page" [class.advanced]="advanced()">
  <div class="control-header">
    <button mat-icon-button (click)="goBack()">
      <mat-icon>arrow_back</mat-icon>
    </button>
    <span class="control-title">{{ roomName() }} &nbsp;·&nbsp; {{ ip() }}</span>
    <button class="fullscreen-btn" mat-icon-button (click)="openFullscreen()" title="Open fullscreen">
      <mat-icon>open_in_new</mat-icon>
    </button>
  </div>

  <div class="iframe-wrapper" [class.advanced]="advanced()">
    <iframe
      [src]="iframeSrc()"
      frameborder="0"
      allow="autoplay; fullscreen"
    ></iframe>
  </div>
</div>
